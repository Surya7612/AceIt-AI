[project]
name = "aceit-ai"
version = "0.1.0"
description = "Flask interview-prep platform with AI-assisted study plans, documents, and RAG chat."
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14.0",
    "beautifulsoup4>=4.13.3",
    "pillow>=11.0.0",
    "pypdf>=5.0.0",
    "celery>=5.4.0",
    "email-validator>=2.2.0",
    "flask-login>=0.6.3",
    "flask>=3.1.0",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "openai>=1.61.1",
    "python-dotenv>=1.0.1",
    "psycopg2-binary>=2.9.10",
    "pytesseract>=0.3.13",
    "redis>=5.2.1",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.38",
    "werkzeug>=3.1.3",
    "flask-wtf>=1.2.2",
    "trafilatura>=2.0.0",
    "twilio>=9.4.4",
    "stripe>=11.5.0",
    "slack-sdk>=3.34.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
